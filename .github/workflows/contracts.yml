name: Contracts

on:
  push:
    branches: ['**']
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/contracts.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/contracts.yml'

jobs:
  contracts-test:
    name: Contracts - Test, Format, Lint, Audit, Deny
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts

      - name: cargo test
        run: cargo test --all
        working-directory: contracts

      - name: cargo test with fuzz (60s timeout)
        run: timeout 60 cargo test --lib fuzz || true
        working-directory: contracts

      - name: cargo fmt check
        run: cargo fmt --check
        working-directory: contracts

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: contracts

      - name: cargo audit
        run: cargo audit --deny warnings
        working-directory: contracts

      - name: cargo deny
        run: cargo deny check
        working-directory: contracts

  contracts-build-wasm:
    name: Contracts - Build WASM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts

      - name: Build WASM contracts
        run: ./scripts/build.sh

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-contracts
          path: contracts/**/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7

  stellar-testnet-integration:
    name: Stellar - Testnet Integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
      STELLAR_PUBLIC_KEY: ${{ secrets.STELLAR_PUBLIC_KEY }}
      TOKEN_CONTRACT_ID: ${{ secrets.TOKEN_CONTRACT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Stellar SDK testnet state
        uses: actions/cache@v4
        with:
          path: |
            ~/.stellar
            ~/.npm
          key: stellar-testnet-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            stellar-testnet-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Fund testnet account
        run: ./scripts/fund-testnet.sh

      - name: Run Stellar integration tests
        run: ./scripts/test-integration.sh

      - name: Run e2e suite
        run: npm run test:e2e -- --grep @e2e
